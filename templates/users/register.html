{% extends 'base.html' %}

{% block content %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-5">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">
                    Create Account
                </h2>

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">
                            Username
                        </label>

                        {{ form.username }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Email
                        </label>

                        {{ form.email }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Password
                        </label>

                        {{ form.password1 }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Confirm Password
                        </label>

                        {{ form.password2 }}
                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100">

                        Register

                    </button>

                </form>

                <hr>

                <p class="text-center mb-0">

                    Already have an account?

                    <a href="/login/">
                        Login
                    </a>

                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
